# Site Settings
name: elphon
title: Elphon's blog
description: 테스트
tags:
  - blog
  - template
  - jekyll
  - theme
  - netlify
show_hero: true
menu:
  - title: Home
    url: https://elphon.github.io
  - title: About
    url: /about
  - title: Contact
    url: /contact
  - title: Feed
    url: /feed.xml
  - title: Tags
    url: /tags
email: elphon909@gmail.com
# See: https://disqus.com/
disqus_username: elphon-github-io
# Contact Form Setting
# See: https://formspree.io/
formspree_form_id: mbjnzypy
timezone: Asia/Seoul

# Social Media Settings
# Remove the item if you don't need it
github_username: elphon
facebook_username: facebook_username
twitter_username: twitter_username
instagram_username: sangchu_7724
linkedin_username: linkedin_username
medium_username: medium_username

# Posts Settings
show_time_bar: true
show_modal_on_exit: false
show_modal_on_finish_post: true
two_columns_layout: true

comments:
  provider: "disqus"
  disqus:
    shortname: "elphon-github-io"
  discourse:
    server:

# Photo post validation logs layout/data mistakes during Jekyll builds.
# Set true when all existing photo posts are clean and warnings should fail builds.
photo_validation_strict: false

# Advanced Settings
baseurl: ""
url: "https://elphon.github.io"
google_analytics: "G-NRW525PW6E"
language: "ko"
categories_folder: category
sent_message_url: "/contact/message-sent/"
safe: false

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:title/
collections:
  authors:
    output: true
paginate_path: "/page/:num/"
show_get_theme_btn: true
use_logo: false
lang: ko

# Content paginator
paginate_content:
  enabled: true
  debug: false
  collections:
    - posts
  auto: false
  separator: "--page-break--"
  permalink: "/:num/"
  seo_canonical: true
  properties:
    part:
      is_generated: true
    last:
      is_generated: true
    single:
      is_generated: true

# SASS
sass:
  style: compressed

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-paginate-content

# Exclude source/build-only files from the generated site
exclude:
  - docs/
  - vendor/
  - LICENSE
  - CHANGELOG.md
  - jekflix.gemspec
  - package.json
  - package-lock.json
  - src
  - node_modules
  - initpost.sh
  - Gemfile
  - Gemfile.lock
  - gulpfile.js
  - README.md

# Theme
version: v3.1.2
