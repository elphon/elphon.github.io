<div class="photo-lightbox" data-photo-lightbox aria-hidden="true" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="photo-lightbox__backdrop" data-lightbox-close></div>
    <div class="photo-lightbox__viewer">
        <div class="photo-lightbox__toolbar">
            <span data-lightbox-counter>01 / 01</span>
            <div>
                <button type="button" data-lightbox-fullscreen aria-label="Toggle fullscreen">⛶</button>
                <button type="button" data-lightbox-close aria-label="Close photo viewer">×</button>
            </div>
        </div>
        <button class="photo-lightbox__nav photo-lightbox__nav--prev" type="button" data-lightbox-prev aria-label="Previous photograph">←</button>
        <figure class="photo-lightbox__figure">
            <img data-lightbox-image src="" alt="">
            <figcaption>
                <strong data-lightbox-caption></strong>
                <span data-lightbox-meta></span>
            </figcaption>
        </figure>
        <button class="photo-lightbox__nav photo-lightbox__nav--next" type="button" data-lightbox-next aria-label="Next photograph">→</button>
    </div>
</div>
