{% if site.disqus_username %}
<section class="comments" data-disqus-container>
    <h3>{{ site.data.translations.text.comments | default: "Comments" }}</h3>
    <div id="disqus_thread"></div>
</section>
<script>
(() => {
    const container = document.querySelector('[data-disqus-container]');
    if (!container) return;

    let loaded = false;
    const loadDisqus = () => {
        if (loaded) return;
        loaded = true;

        const shortname = {{ site.disqus_username | jsonify }};
        window.disqus_config = function () {
            this.page.url = {{ page.url | prepend: site.baseurl | prepend: site.url | jsonify }};
            this.page.identifier = {{ page.url | jsonify }};
            this.page.title = {{ page.title | jsonify }};
        };

        const script = document.createElement('script');
        script.src = `https://${shortname}.disqus.com/embed.js`;
        script.async = true;
        script.setAttribute('data-timestamp', Date.now().toString());
        (document.head || document.body).appendChild(script);
    };

    if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries) => {
            if (entries.some((entry) => entry.isIntersecting)) {
                observer.disconnect();
                loadDisqus();
            }
        }, { rootMargin: '800px 0px' });
        observer.observe(container);
        return;
    }

    const onScroll = () => {
        if (container.getBoundingClientRect().top <= window.innerHeight + 800) {
            window.removeEventListener('scroll', onScroll);
            loadDisqus();
        }
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
})();
</script>
{% endif %}
