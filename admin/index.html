<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Elphon Content Manager</title>
</head>
<body>
  <!-- Netlify CMS and Netlify Identity are intentionally scoped to /admin. -->
  <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!-- Legacy color picker kept for the theme fields in admin/config.yml. -->
  <script src="../assets/js/react.min.js"></script>
  <script src="../assets/js/widgets/color/react-color.min.js"></script>
  <script src="../assets/js/widgets/color/color.min.js"></script>
  <script>
    if (window.CMS && window.NetlifyCMSWidgetColor) {
      CMS.registerWidget('color', NetlifyCMSWidgetColor.Control);
    }
  </script>
</body>
</html>
